<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header></header>
    <main>

        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <label for="full Name">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
                <label for="email">Email</label>
                <input type="text" id="useremail" name="useremail">
                <button type="submit">Submit </button>
            </fieldset>
            <!-- <label for="quantity">select Quantity</label>
            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option> -->
            <!-- </select> -->
            <fieldset>
                <legend>Question</legend>
                <label for="browser">What is your favorite internet browser</label>
                <select name="browser" id="browser">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="others">Others</option>
                </select>
                <label for="pet">Do have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
                <label for="feedback">List the places you have liveds:</label>
                <textarea name="feedback" id="feedback" rows="4"
                  placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali "></textarea>
                <button type="submit">Submit Poll</button>
            </fieldset>

        </form>
    </main>
    <footer></footer>
</body>

</html>
